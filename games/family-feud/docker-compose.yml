services:
  backend:
    build: ./backend
    ports:
      - "8600:8000"
    environment:
      REVELRY_CORS_ORIGINS: '["http://localhost:3600"]'

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_BASE_URL: http://localhost:8600
        NEXT_PUBLIC_WS_BASE_URL: ws://localhost:8600
    ports:
      - "3600:3000"
    depends_on:
      - backend
