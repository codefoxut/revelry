services:
  backend:
    build: ./backend
    ports:
      - "8300:8000"
    environment:
      REVELRY_CORS_ORIGINS: '["http://localhost:3300"]'

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_BASE_URL: http://localhost:8300
        NEXT_PUBLIC_WS_BASE_URL: ws://localhost:8300
    ports:
      - "3300:3000"
    depends_on:
      - backend
