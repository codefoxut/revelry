services:
  backend:
    build: ./backend
    ports:
      - "8200:8000"
    environment:
      REVELRY_CORS_ORIGINS: '["http://localhost:3200"]'

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_BASE_URL: http://localhost:8200
        NEXT_PUBLIC_WS_BASE_URL: ws://localhost:8200
    ports:
      - "3200:3000"
    depends_on:
      - backend
