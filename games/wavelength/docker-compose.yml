services:
  backend:
    build: ./backend
    ports:
      - "8800:8000"
    environment:
      REVELRY_CORS_ORIGINS: '["http://localhost:3800"]'

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_BASE_URL: http://localhost:8800
        NEXT_PUBLIC_WS_BASE_URL: ws://localhost:8800
    ports:
      - "3800:3000"
    depends_on:
      - backend
