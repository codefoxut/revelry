services:
  backend:
    build: ./backend
    ports:
      - "9000:8000"
    environment:
      REVELRY_CORS_ORIGINS: '["http://localhost:4100"]'

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_BASE_URL: http://localhost:9000
        NEXT_PUBLIC_WS_BASE_URL: ws://localhost:9000
    ports:
      - "4100:3000"
    depends_on:
      - backend
