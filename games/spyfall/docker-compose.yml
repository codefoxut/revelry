services:
  backend:
    build: ./backend
    ports:
      - "8100:8000"
    environment:
      REVELRY_CORS_ORIGINS: '["http://localhost:3100"]'

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_BASE_URL: http://localhost:8100
        NEXT_PUBLIC_WS_BASE_URL: ws://localhost:8100
    ports:
      - "3100:3000"
    depends_on:
      - backend
