services:
  backend:
    build: ./backend
    ports:
      - "8700:8000"
    environment:
      REVELRY_CORS_ORIGINS: '["http://localhost:3700"]'

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_BASE_URL: http://localhost:8700
        NEXT_PUBLIC_WS_BASE_URL: ws://localhost:8700
    ports:
      - "3700:3000"
    depends_on:
      - backend
